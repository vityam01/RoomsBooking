services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: conference_rooms
      POSTGRES_USER: conference_rooms
      POSTGRES_PASSWORD: conference_rooms
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conference_rooms"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=conference_rooms;Username=conference_rooms;Password=conference_rooms"
      Business__TimeZoneId: "Europe/Kyiv"
      EnableSwagger: "true"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
