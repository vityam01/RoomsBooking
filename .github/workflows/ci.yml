name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: conference_rooms_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Enable btree_gist extension
        run: psql -h localhost -U postgres -d conference_rooms_test -c "CREATE EXTENSION IF NOT EXISTS btree_gist;"
        env:
          PGPASSWORD: postgres

      - name: Restore
        run: dotnet restore ConferenceRoomApi.slnx

      - name: Build
        run: dotnet build ConferenceRoomApi.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test ConferenceRoomApi.slnx --no-build --configuration Release --logger "console;verbosity=normal"
